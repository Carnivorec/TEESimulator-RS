name: Build

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ '**.md' ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            native-certgen/target
          key: rust-${{ runner.os }}-${{ hashFiles('native-certgen/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build module ZIPs
        run: |
          chmod +x ./gradlew
          ./gradlew zipRelease zipDebug -Porg.gradle.parallel=true -Porg.gradle.vfs.watch=true -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Validate flashable module ZIPs
        shell: bash
        run: |
          set -euo pipefail
          for variant in Release Debug; do
            shopt -s nullglob
            matches=(out/TEESimulator-RS-*-"$variant".zip)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $variant ZIP, found ${#matches[@]}"
              exit 1
            fi
            archive="${matches[0]}"
            unzip -tq "$archive" >/dev/null
            entries="$(unzip -Z1 "$archive")"
            for required in module.prop customize.sh service.sh daemon sepolicy.rule; do
              if ! grep -Fxq "$required" <<< "$entries"; then
                echo "::error::$archive missing $required at its root"
                exit 1
              fi
            done
            if ! grep -Eq '^(classes.dex|service.apk)$' <<< "$entries"; then
              echo "::error::$archive contains no key interception code"
              exit 1
            fi
            version="$(unzip -p "$archive" module.prop | sed -n 's/^version=//p' | tr -d '\r')"
            id="$(unzip -p "$archive" module.prop | sed -n 's/^id=//p' | tr -d '\r')"
            [ "$id" = "tricky_store" ]
            [ "$(basename "$archive")" = "TEESimulator-RS-$version-$variant.zip" ]
            echo "Validated $archive: id=$id version=$version"
          done

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TEESimulator-RS-release-zip
          path: out/TEESimulator-RS-*-Release.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload debug build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TEESimulator-RS-debug-zip
          path: out/TEESimulator-RS-*-Debug.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload R8 mappings
        uses: actions/upload-artifact@v4
        with:
          name: release-mappings
          path: app/build/outputs/mapping/release
          retention-days: 30
          compression-level: 9

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # download-artifact unwraps GitHub's outer artifact archive, leaving the
      # actual flashable ZIP. We upload that ZIP directly to GitHub Releases.
      - name: Download flashable Release ZIP
        uses: actions/download-artifact@v4
        with:
          name: TEESimulator-RS-release-zip
          path: zips

      - name: Download flashable Debug ZIP
        uses: actions/download-artifact@v4
        with:
          name: TEESimulator-RS-debug-zip
          path: zips

      - name: Validate release payload and derive version from module.prop
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_matches=(zips/TEESimulator-RS-*-Release.zip)
          debug_matches=(zips/TEESimulator-RS-*-Debug.zip)
          [ "${#release_matches[@]}" -eq 1 ] && [ "${#debug_matches[@]}" -eq 1 ]
          release_zip="${release_matches[0]}"
          debug_zip="${debug_matches[0]}"
          unzip -tq "$release_zip" >/dev/null
          unzip -tq "$debug_zip" >/dev/null
          version="$(unzip -p "$release_zip" module.prop | sed -n 's/^version=//p' | tr -d '\r')"
          code="$(unzip -p "$release_zip" module.prop | sed -n 's/^versionCode=//p' | tr -d '\r')"
          [ -n "$version" ] && [[ "$code" =~ ^[0-9]+$ ]]
          [ "$(basename "$release_zip")" = "TEESimulator-RS-$version-Release.zip" ]
          [ "$(basename "$debug_zip")" = "TEESimulator-RS-$version-Debug.zip" ]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "release_zip=$release_zip" >> "$GITHUB_OUTPUT"
          echo "debug_zip=$debug_zip" >> "$GITHUB_OUTPUT"
          echo "Verified flashable ZIPs: $version (versionCode=$code)"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## TEESimulator-RS — PKCS#8 Keybox Compatibility
          
          - Native support for unencrypted PKCS#8 EC/RSA PEM private keys (BEGIN PRIVATE KEY).
          - Validates each PKCS#8 private key against the leaf certificate public key.
          - Empty Keybox parse results no longer remain cached indefinitely.
          - Preserves underlying KeyMint service-specific error codes for diagnosis.
          
          **Installation:** Download the `*-Release.zip` attachment on this Release page directly and install it through your root module manager. Do not flash the outer GitHub Actions Artifact ZIP.
          
          **Note:** Built successfully in CI; device compatibility and key attestations depend on the installed Keybox and Android environment. Existing persistent keystore keys are not removed by this change.
          EOF

      - name: Publish raw module ZIPs to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_ZIP: ${{ steps.ver.outputs.release_zip }}
          DEBUG_ZIP: ${{ steps.ver.outputs.debug_zip }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$RELEASE_ZIP" "$DEBUG_ZIP" --clobber
            gh release edit "$VERSION" --latest
          else
            gh release create "$VERSION" "$RELEASE_ZIP" "$DEBUG_ZIP" \
              --target "$GITHUB_SHA" \
              --title "TEESimulator-RS $VERSION (PKCS#8 Fix)" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Update fork OTA metadata
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          RELEASE_ZIP: ${{ steps.ver.outputs.release_zip }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip_name="$(basename "$RELEASE_ZIP")"
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$zip_name"
          changelog_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/module/changelog.md"
          jq -n --arg version "$VERSION" --argjson code "$VERSION_CODE" \
            --arg zip "$release_url" --arg changelog "$changelog_url" \
            '{version:$version, versionCode:$code, zipUrl:$zip, changelog:$changelog}' \
            > module/update.json
          git add module/update.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "chore: point OTA metadata to $VERSION release [skip ci]"
            git push origin HEAD:main
          fi
